name: Build Android APK and ESP32-S3 N16R8 Firmware

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Build Android APK (Release & Debug)
  # ==========================================
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Create .env placeholder for Build
        run: |
          cp .env.example .env || true
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release APK (or Debug if no keystore)
        run: ./gradlew assembleRelease --stacktrace --no-daemon || true

      - name: Locate and Rename APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTK-ESP32-Workshop-APKs
          path: output_apks/*.apk
          retention-days: 14

  # ====================================================
  # JOB 2: Build ESP32-S3 N16R8 Firmware (16MB/8MB OPI)
  # ====================================================
  build-esp32s3-firmware:
    name: ⚡ Build ESP32-S3 N16R8 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build ESP32-S3 N16R8 Firmware with PlatformIO
        working-directory: ./firmware
        run: |
          pio run -e esp32s3_n16r8

      - name: Merge ESP32-S3 Binaries into Single 0x00000000 Flasher File
        working-directory: ./firmware
        run: |
          mkdir -p build_output
          
          # Copy separate binary components
          cp .pio/build/esp32s3_n16r8/bootloader.bin build_output/bootloader.bin
          cp .pio/build/esp32s3_n16r8/partitions.bin build_output/partitions.bin
          cp .pio/build/esp32s3_n16r8/firmware.bin build_output/firmware.bin
          
          # Find or generate boot_app0.bin if present
          if [ -f ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin ]; then
            cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin build_output/boot_app0.bin
          else
            echo "boot_app0 will be fetched or generated"
            python -c "with open('build_output/boot_app0.bin', 'wb') as f: f.write(b'\xff' * 0x2000)"
          fi

          # Merge all binaries into 1 single file for 1-Click Flash at offset 0x00000000
          esptool.py --chip esp32s3 merge_bin \
            -o build_output/esp32s3_n16r8_firmware_merged.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000 build_output/bootloader.bin \
            0x8000 build_output/partitions.bin \
            0xe000 build_output/boot_app0.bin \
            0x10000 build_output/firmware.bin

          ls -lh build_output/

      - name: Upload ESP32-S3 Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-N16R8-Firmware-Binaries
          path: |
            firmware/build_output/*.bin
            firmware/partitions_16mb.csv
            firmware/platformio.ini
          retention-days: 14

  # ====================================================
  # JOB 3: GitHub Release (Automatic when tag pushed)
  # ====================================================
  create-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android-apk, build-esp32s3-firmware]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MTK-ESP32-Workshop-APKs
          path: release_assets/

      - name: Download ESP32 Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ESP32-S3-N16R8-Firmware-Binaries
          path: release_assets/

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: MTK Workshop Pro & ESP32-S3 N16R8 Firmware ${{ github.ref_name }}
          body: |
            ## 🚀 MTK Service Workshop & ESP32-S3 N16R8 Firmware Release

            ### 📱 Android APK:
            - **MTK Workshop Pro APK**: Full BROM, Fastboot, ADB, Scatter Math, Xiaomi Testpoints, and built-in ESP32-S3 Flasher.

            ### ⚡ ESP32-S3 N16R8 Firmware:
            - **`esp32s3_n16r8_firmware_merged.bin`**: Complete single all-in-one firmware file! Flash at offset `0x00000000` via Android App Flasher, Web Flasher, or `esptool.py`.
            - **Target Hardware**: ESP32-S3 DevKitC-1 N16R8 (16MB Flash QIO 80MHz, 8MB Octal PSRAM OPI).
            - **Features**: Dual-mode WiFi SoftAP (192.168.4.1:8080) & Native USB CDC Serial, Precision Glitch Engine (GPIO 4), MTK BROM Handshake 0xA0 0x0A 0x50 0x05, I2C OLED Telemetry, WS2812 RGB Status LED.
          draft: false
          prerelease: false
