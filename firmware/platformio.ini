; =================================================================
; MTK Service Coprocessor & BROM Bridge
; Hardware: ESP32-S3-DevKitC-1-N16R8 (16MB Quad/Octal Flash, 8MB Octal PSRAM)
; =================================================================

[platformio]
default_envs = esp32s3_n16r8
src_dir = src

[env:esp32s3_n16r8]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; CPU & Memory Architecture Configuration for N16R8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi

; Build Flags for 8MB Octal PSRAM & Native USB CDC
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_SPEED_80M=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DMTK_FIRMWARE_VERSION=\"2.5.0-N16R8\"
    -DGLITCH_GPIO_PIN=4
    -DSTATUS_RGB_PIN=48
    -DI2C_SDA_PIN=8
    -DI2C_SCL_PIN=9
    -DUART_BROM_RX_PIN=19
    -DUART_BROM_TX_PIN=20

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    fastled/FastLED @ ^3.6.0
    links2004/WebSockets @ ^2.4.1

monitor_speed = 115200
upload_speed = 921600
